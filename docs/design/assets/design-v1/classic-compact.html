<!--COMPACT_ENGINE-->
<script>
(()=>{
 const root=document.getElementById('sf-editors');

 const instances=[];

  window.openai?.setWidgetState?.({modelContent:{project:'SurvivalFlow',direction:'Монтажная',layout:'Классическая',compact:true},privateContent:{editors:privateState}})?.catch(()=>{});
 }
 const defaults=i=>({timing:'middle',start:[32,29,36][i%3],duration:2.5,position:'bottom',x:50,y:77,width:84,opacity:100,template:'offer',text:'А ты знаешь, что делать?',brightness:0,contrast:100,saturation:100,warmth:4,zoom:100,mirror:false,targets:['t1','t2','t3','y1','y2','y3'],scope:'all',caption:'Истории, которые пригодятся. Продолжение — в канале. #выживание',schedule:'planned',at:'18:00',variant:'t1'});
 function makeSources(){return [{id:'ep1',name:'elevator_01.mp4',title:'ЛИФТ ОСТАНОВИЛСЯ',duration:64,c:defaults(0)},{id:'ep2',name:'metro_02.mp4',title:'ПОЕЗД НЕ ПРИДЁТ',duration:58,c:defaults(1)},{id:'ep3',name:'shelter_03.mp4',title:'НЕ ОТКРЫВАЙ ДВЕРЬ',duration:72,c:defaults(2)}];}
 class Editor{
  constructor(el,id){

   this.build();this.el.addEventListener('click',e=>this.click(e));this.el.addEventListener('input',e=>this.input(e));this.el.addEventListener('change',e=>this.change(e));this.el.addEventListener('keydown',e=>{if(e.key==='Escape')this.closeDialog();});
   this.el.addEventListener('pointerdown',e=>this.pointerDown(e));this.el.addEventListener('pointermove',e=>this.pointerMove(e));this.el.addEventListener('pointerup',()=>{if(this.drag){this.drag=null;saveAll();}});this.el.addEventListener('pointercancel',()=>this.drag=null);

   if(globalThis.Tweak){const d={accent:getComputedStyle(this.el).getPropertyValue('--e-accent').trim()||'#f5a064',radius:6};const t=new Tweak({container:this.el,onChange:()=>{this.el.style.setProperty('--e-accent',d.accent);this.el.style.setProperty('--e-radius',d.radius+'px');}});t.addColorPicker(d,'accent',{label:'Акцент монтажной',reference:'--e-accent'});t.addSlider(d,'radius',{label:'Скругления',min:0,max:12,unit:'px',reference:'--e-radius'});}

  applySaved(s){if(!s)return;if(names[s.view])this.s.view=s.view;if(['banner','filters','publish'].includes(s.tab))this.s.tab=s.tab;if(Number.isInteger(s.index)&&s.index>=0&&s.index<3)this.s.index=s.index;if(typeof s.name==='string')this.s.name=s.name.slice(0,80);if(s.settings&&typeof s.settings==='object')Object.assign(this.s.settings,s.settings);if(Array.isArray(s.config))for(const entry of s.config){const source=this.s.sources.find(x=>x.id===entry.id);if(source&&entry.c&&typeof entry.c==='object')source.c={...source.c,...entry.c,targets:Array.isArray(entry.c.targets)?entry.c.targets.filter(x=>this.s.channels.some(a=>a.id===x)):source.c.targets};}}
  build(){this.el.innerHTML=`<header class="e-head"><div class="e-row"><div class="e-logo">survival<b>flow</b></div><button type="button" class="e-project" data-action="rename" aria-label="Переименовать пакет">${escape(this.s.name)} ${icon('chevron-down')}</button></div><div class="e-row"><span class="e-badge">ПРОТОТИП</span>${button(icon('save')+' Сохранить','save','small')}${button(icon('settings-2'),'navigate','small','data-view="settings" aria-label="Настройки"')}</div></header><div class="e-layout"><nav class="e-nav" aria-label="Разделы монтажной">${Object.keys(names).map(view=>`<button type="button" data-action="navigate" data-view="${view}" aria-pressed="${this.s.view===view}">${icon(icons[view])}<span>${names[view]}</span>${view==='queue'?'<span class="e-nav-count" data-queue-count>0</span>':''}</button>`).join('')}</nav><div data-view-root></div></div><footer class="e-bottom" data-notice aria-live="polite">${this.notice}</footer><div class="e-dialog-layer" data-dialog hidden></div><input type="file" accept="video/*" multiple data-import="video" hidden><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-import="banner" hidden>`;this.icons();}
  icons(){globalThis.lucide?.createIcons({attrs:{width:16,height:16}})}
  tell(text){this.notice=text;this.q('[data-notice]').textContent=text;this.q('[data-notice]').setAttribute('data-tooltip',text);}

  renderView(){this.stop();const v=this.s.view;this.qa('.e-nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));this.q('[data-view-root]').innerHTML=v==='editor'?this.editor():v==='queue'?this.queue():v==='channels'?this.channels():v==='stats'?this.stats():this.settings();this.updateCount();this.icons();if(v==='editor'){this.bindVideo();this.updatePreview();this.syncPublish();}}
  editor(){const src=this.source(),c=src.c;return `<div class="e-editor"><aside class="e-assets">${this.assets()}</aside><main class="e-viewer"><div class="e-viewer-heading"><span>${escape(src.name)}</span><span class="e-mono">9:16 · ${clock(src.duration)}</span></div><div class="e-preview" data-preview aria-label="Предпросмотр ролика с баннером">${src.url?`<video class="e-video" playsinline preload="metadata" src="${escape(src.url)}" data-video></video>`:`<div class="e-scene" data-scene><span class="e-number">−03</span><div class="e-scene-title"><small>ИСТОРИИ ВЫЖИВАНИЯ / ${String(this.s.index+1).padStart(2,'0')}</small>${escape(src.title)}</div></div>`}<div class="e-overlay" data-overlay aria-label="Рекламный баннер, можно перетаскивать"></div></div><div class="e-viewer-controls">${button(icon('skip-back'),'start','small','aria-label="В начало ролика"')}${button(icon('play')+' Смотреть','play','small')}${button(icon('skip-forward'),'to-banner','small','aria-label="К баннеру"')}<span class="e-mono"><span data-clock>${clock(this.s.time)}</span><span class="e-muted"> / ${clock(src.duration)}</span></span></div><div class="e-viewer-tools"><div class="e-row">${button('До / после','compare','small',`aria-pressed="${this.s.compare}"`)}${button(icon('eye'),'toggle-banner','small',`aria-label="Скрыть или показать баннер" aria-pressed="${this.s.hiddenBanner}"`)}</div><select class="e-field" data-control="variant" aria-label="Версия канала">${this.s.channels.map(a=>option(a.id,a.platform+' / '+a.name,c.variant)).join('')}</select></div></main><aside class="e-inspector"><div class="e-tabs" role="tablist" aria-label="Настройки ролика">${[['banner','Баннер'],['filters','Фильтры'],['publish','Выпуск']].map(([id,label])=>`<button type="button" role="tab" id="${this.id}-tab-${id}" aria-controls="${this.id}-inspector-panel" aria-selected="${this.s.tab===id}" data-action="tab" data-tab="${id}">${label}</button>`).join('')}</div><div data-inspector id="${this.id}-inspector-panel" role="tabpanel" aria-labelledby="${this.id}-tab-${this.s.tab}">${this.inspector()}</div><div class="e-savebar"><div class="e-row e-between"><button type="button" class="e-button quiet small" style="padding:0;min-height:16px" data-action="target-dialog">Каналы назначения ↗</button><span class="e-mono" data-target-count>${c.targets.length}/${this.s.channels.length}</span></div><div class="e-targets">${this.targets()}</div><label class="e-scope"><input type="checkbox" data-control="scope" ${c.scope==='all'?'checked':''}> Весь пакет · ${this.s.sources.length} ролика</label>${button('В очередь · <span data-version-count>'+this.plannedCount()+'</span> версий '+icon('arrow-up-right'),'enqueue','primary e-primary-action')}</div></aside><section class="e-timeline">${this.timeline()}</section></div>`;}
  assets(){const page=Math.floor(this.s.index/3),pages=Math.ceil(this.s.sources.length/3);return `<div class="e-assets-head e-row e-between"><span class="e-mono e-muted">ИСХОДНИКИ</span><span class="e-mono">${String(this.s.sources.length).padStart(2,'0')}</span></div>${this.s.sources.slice(page*3,page*3+3).map((src,j)=>{const i=page*3+j;return `<div class="e-source ${i===this.s.index?'active':''}"><button type="button" class="e-source-select" data-action="source" data-index="${i}" aria-pressed="${i===this.s.index}"><span class="e-thumb"><span>${String(i+1).padStart(2,'0')}</span><span>${clock(src.duration)}</span></span><span class="e-source-title">${escape(src.name)}</span></button><div class="e-source-tools"><span class="e-muted">${src.url?'Локальный':'Демо'}</span><button type="button" data-action="remove-source" data-index="${i}" aria-label="Удалить ${escape(src.name)}">×</button></div></div>`;}).join('')}${pages>1?`<div class="e-source-pages">${button('←','source-page','small',`data-index="${Math.max(0,(page-1)*3)}" aria-label="Предыдущие исходники" ${page===0?'disabled':''}`)}<span class="e-mono e-muted">${page+1}/${pages}</span>${button('→','source-page','small',`data-index="${(page+1)*3}" aria-label="Следующие исходники" ${page===pages-1?'disabled':''}`)}</div>`:''}${button(icon('plus')+' Видео','import-video','e-add','aria-label="Добавить видео"')}`;}
  label(text,key,type='range',attrs=''){const c=this.config();return `<label class="e-label"><span>${text}<output data-output="${key}">${escape(c[key])}</output></span><input class="e-field" type="${type}" data-control="${key}" value="${escape(c[key])}" ${attrs}></label>`;}
  inspector(){const c=this.config(),src=this.source();if(this.s.tab==='banner')return `<div class="e-file-picker"><select class="e-field" data-control="template" aria-label="Файл баннера">${option('offer','tg_offer.png · демо',c.template)}${option('episode','Продолжение истории',c.template)}${this.bannerURL?option('custom',this.bannerName,c.template):''}</select>${button(icon('upload'),'import-banner','small','aria-label="Загрузить баннер"')}</div><div class="e-segment"><button type="button" data-action="timing" data-mode="manual" aria-pressed="${c.timing==='manual'}">Свой таймкод</button><button type="button" data-action="timing" data-mode="middle" aria-pressed="${c.timing==='middle'}">Середина</button></div><div class="e-grid2">${this.label('Начало, сек','start','number',`min="0" max="${src.duration-.1}" step="0.1" ${c.timing==='middle'?'disabled':''}`)}${this.label('Показ, сек','duration','number',`min="0.1" max="${src.duration}" step="0.1"`)}</div><label class="e-label"><span>Положение</span><select class="e-field" data-control="position">${option('bottom','Нижняя часть',c.position)}${option('center','По центру',c.position)}${option('top','Верхняя часть',c.position)}${option('custom','Своя позиция',c.position)}</select></label>${this.label('Ширина, %','width','range','min="25" max="95"')}<div class="e-row e-between" style="margin-top:9px">${button('Оформление…','banner-details','small')}${button('Сбросить','reset-banner','small')}</div><p class="e-small e-muted" style="margin-top:9px">Баннер можно двигать в предпросмотре.</p>`;
   if(this.s.tab==='filters')return `<label class="e-label" style="margin-top:0"><span>Цветовой пресет</span><select class="e-field" data-control="preset"><option value="custom">Свои настройки</option><option value="warm">Тёплый</option><option value="cold">Холодный</option><option value="soft">Мягкий</option><option value="neutral">Без фильтра</option></select></label><div class="e-grid2">${this.label('Яркость','brightness','range','min="-15" max="15"')}${this.label('Контраст, %','contrast','range','min="80" max="120"')}${this.label('Насыщенность, %','saturation','range','min="70" max="130"')}${this.label('Теплота','warmth','range','min="-15" max="15"')}${this.label('Масштаб, %','zoom','range','min="100" max="110"')}</div><label class="e-check"><input type="checkbox" data-control="mirror" ${c.mirror?'checked':''}> Отразить изображение</label>${button('Сбросить фильтры','reset-filters','small','style="width:100%"')}`;
   return `<label class="e-label" style="margin-top:0"><span>Описание ролика</span><textarea class="e-field" data-control="caption" maxlength="500">${escape(c.caption)}</textarea></label><div class="e-grid2"><label class="e-label"><span>Режим</span><select class="e-field" data-control="schedule">${option('planned','Расписание',c.schedule)}${option('now','Сразу',c.schedule)}</select></label><label class="e-label"><span>Начало · ${this.s.settings.timezone==='UTC'?'UTC':'МСК'}</span><input class="e-field" type="time" data-control="at" value="${escape(c.at)}" ${c.schedule==='now'?'disabled':''}></label></div><label class="e-label"><span>Экспорт</span><select class="e-field" data-control="format"><option>1080 × 1920 · H.264</option><option>720 × 1280 · H.264</option></select></label>${button('Применить ко всем роликам','apply-all','small','style="margin-top:12px;width:100%"')}<p class="e-small e-muted" style="margin-top:9px">${this.s.sources.length} исходника → ${this.plannedCount()} отдельных версий.</p>`;
  }
  targets(all=false){const c=this.config();return this.s.channels.slice(0,all?12:6).map(a=>`<button type="button" class="e-target" data-action="target" data-id="${a.id}" aria-pressed="${c.targets.includes(a.id)}" aria-label="${a.platform} ${escape(a.name)}">${a.platform} ${String(this.s.channels.filter(x=>x.platform===a.platform).findIndex(x=>x.id===a.id)+1).padStart(2,'0')}${a.connected?'':' !'}</button>`).join('');}
  timeline(){const src=this.source();return `<div class="e-row e-between"><span class="e-mono e-muted">ТАЙМЛАЙН</span><span class="e-mono" data-timing-summary>${clock(src.c.start)} → ${clock(src.c.start+src.c.duration)}</span><span data-time-output hidden>${clock(this.s.time)}</span></div><div class="e-ruler">${[0,.25,.5,.75,1].map(n=>`<span>${clock(src.duration*n)}</span>`).join('')}</div><div class="e-track banner" aria-label="Отрезок показа баннера"><span class="e-banner-mark" data-banner-mark></span></div><input class="e-field" type="range" min="0" max="${src.duration}" step="0.1" value="${this.s.time}" data-scrub aria-label="Позиция просмотра ролика">`;}
  updateInspector(){this.q('[data-inspector]').innerHTML=this.inspector();this.q('[data-inspector]').setAttribute('aria-labelledby',`${this.id}-tab-${this.s.tab}`);this.qa('.e-tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===this.s.tab)));this.syncPublish();this.icons();}
  syncPublish(){const format=this.q('[data-control=format]');if(format)format.value=this.config().format||'1080 × 1920 · H.264';}
  plannedCount(){const c=this.config();return c.targets.length*(c.scope==='all'?this.s.sources.length:1)}
  updateCount(){const el=this.q('[data-queue-count]');if(el)el.textContent=this.s.jobs.filter(j=>j.status!=='cancelled').length;const c=this.q('[data-version-count]');if(c)c.textContent=this.plannedCount();const n=this.q('[data-target-count]');if(n)n.textContent=this.config().targets.length+'/'+this.s.channels.length;}
  bindVideo(){const video=this.q('[data-video]');if(!video)return;video.addEventListener('loadedmetadata',()=>{if(Number.isFinite(video.duration)){const src=this.source();src.duration=video.duration;if(src.c.timing==='middle')src.c.start=Number((video.duration/2).toFixed(1));this.s.time=Math.min(this.s.time,video.duration);this.q('[data-scrub]').max=video.duration;video.currentTime=this.s.time;this.updatePreview();}});video.addEventListener('timeupdate',()=>{if(this.s.playing){this.s.time=video.currentTime;this.updatePreview();}});video.addEventListener('ended',()=>this.pause());video.addEventListener('error',()=>this.tell('Браузер не смог открыть этот видеоформат. Выбери MP4 с поддерживаемым кодеком.'));}
  updatePreview(){if(this.s.view!=='editor')return;const c=this.config(),src=this.source(),overlay=this.q('[data-overlay]'),preview=this.q('[data-preview]');if(!overlay||!preview)return;const variantIndex=Math.max(0,this.s.channels.findIndex(x=>x.id===c.variant));const delta=variantIndex%3-1;const filter=this.s.compare?'none':`brightness(${1+Number(c.brightness)/100}) contrast(${Number(c.contrast)/100}) saturate(${Number(c.saturation)/100}) sepia(${Math.abs(Number(c.warmth)+delta)/65}) hue-rotate(${-(Number(c.warmth)+delta)*1.4}deg)`;preview.style.setProperty('--video-filter',filter);preview.style.setProperty('--video-scale',this.s.compare?'1':String(Number(c.zoom)/100));const scene=this.q('[data-scene]');if(scene)scene.style.transform=`scale(${this.s.compare?1:Number(c.zoom)/100}) scaleX(${!this.s.compare&&c.mirror?-1:1})`;const video=this.q('[data-video]');if(video)video.style.transform=`scale(${this.s.compare?1:Number(c.zoom)/100}) scaleX(${!this.s.compare&&c.mirror?-1:1})`;overlay.style.left=c.x+'%';overlay.style.top=c.y+'%';overlay.style.width=c.width+'%';overlay.style.opacity=Number(c.opacity)/100;const active=this.s.time>=Number(c.start)&&this.s.time<=Number(c.start)+Number(c.duration);overlay.hidden=this.s.hiddenBanner||this.s.compare||!active;overlay.classList.toggle('image',c.template==='custom'&&!!this.bannerURL);if(c.template==='custom'&&this.bannerURL){if(!overlay.querySelector('img'))overlay.innerHTML='<img alt="Загруженный баннер">';overlay.querySelector('img').src=this.bannerURL;}else{overlay.replaceChildren();const text=document.createElement('div');text.textContent=c.template==='episode'?'Продолжение уже в канале':c.text;const small=document.createElement('small');small.textContent='Больше историй — в нашем канале ↗';overlay.append(text,small);}this.q('[data-clock]').textContent=clock(this.s.time);this.q('[data-time-output]').textContent=clock(this.s.time);this.q('[data-scrub]').value=this.s.time;this.q('[data-timing-summary]').textContent=clock(c.start)+' → '+clock(Number(c.start)+Number(c.duration));const mark=this.q('[data-banner-mark]');mark.style.left=Math.max(0,Math.min(97,c.start/src.duration*100))+'%';mark.style.width=Math.max(3,Math.min(100-c.start/src.duration*100,c.duration/src.duration*100))+'%';this.qa('[data-output]').forEach(el=>el.textContent=c[el.dataset.output]);this.qa('.e-version-grid button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.variant)));const variant=this.q('[data-control=variant]');if(variant)variant.value=c.variant;}
  pause(){this.stop();const b=this.q('[data-action=play]');if(b){b.innerHTML=icon('play')+' Смотреть';this.icons();}}

  removeSource(index){if(this.s.sources.length<=1){this.tell('Оставь хотя бы один исходник или добавь новый.');return;}const src=this.s.sources[index];if(this.s.jobs.some(j=>j.source===src.id)){this.tell('Сначала удали задачи этого исходника из очереди.');return;}if(src.url)URL.revokeObjectURL(src.url);this.s.sources.splice(index,1);this.s.index=Math.min(this.s.index,this.s.sources.length-1);this.s.time=this.config().start;this.renderView();saveAll();}

  enqueue(forceDemo=false){

   if(!selected.length||selected.some(a=>!a.connected||!a.enabled)){this.tell('Среди назначений есть отключённый канал. Включи его в разделе «Каналы» или убери из назначений.');return;}

  queue(){const filtered=this.s.jobs.filter(j=>this.s.queueFilter==='all'||j.status===this.s.queueFilter);const pages=Math.max(1,Math.ceil(filtered.length/4));this.s.queuePage=Math.max(0,Math.min(pages-1,this.s.queuePage));const rows=filtered.slice(this.s.queuePage*4,this.s.queuePage*4+4);const counts={done:this.s.jobs.filter(x=>x.status==='published').length,errors:this.s.jobs.filter(x=>x.status==='error').length};const status={pending:'Ожидает',rendering:'Обработка',scheduled:'В расписании',published:'Опубликовано',error:'Ошибка'};return `<main class="e-content"><div class="e-page-head"><div><h1>Очередь выпуска</h1><p>Демонстрация полного цикла. Реальные запросы к платформам не выполняются.</p></div>${button(icon('arrow-left')+' В монтажную','navigate','','data-view="editor"')}</div><div class="e-summary"><div class="e-stat"><span>Всего задач</span><strong>${this.s.jobs.length}</strong></div><div class="e-stat"><span>Завершено в демо</span><strong>${counts.done}</strong></div><div class="e-stat"><span>Нужна помощь</span><strong>${counts.errors}</strong></div></div><div class="e-toolbar">${button(icon(this.s.running?'pause':'play')+(this.s.running?' Пауза':' Запустить демо'),'queue-play','primary',this.s.jobs.length?'':'disabled')}${button('Тест ошибки','queue-error','small')}${button('Очистить','queue-clear','small')}<select class="e-field" data-queue-filter aria-label="Фильтр очереди">${[['all','Все задачи'],['pending','Ожидают'],['rendering','Обрабатываются'],['scheduled','В расписании'],['published','Опубликованы'],['error','С ошибкой']].map(([v,l])=>option(v,l,this.s.queueFilter)).join('')}</select></div>${rows.length?`<table class="e-table"><thead><tr><th style="width:30%">Видео</th><th style="width:23%">Канал</th><th style="width:15%">Время</th><th style="width:17%">Состояние</th><th style="width:15%">Действия</th></tr></thead><tbody>${rows.map(j=>`<tr><td><button type="button" class="e-button quiet small e-job-title" data-action="job-detail" data-id="${j.id   renderQueue(){if(this.s.view==='queue'){this.q('[data-view-root]').innerHTML=this.queue();this.icons();}this.updateCount();}
  stopWorker(){clearInterval(this.worker);this.worker=null;this.s.running=false;}
  toggleWorker(){if(this.s.running){this.stopWorker();this.renderQueue();this.tell('Демоочередь на паузе.');return;}if(!this.s.jobs.some(j=>['pending','rendering','scheduled'].includes(j.status))){this.tell('Нет задач для запуска. Ошибочные задачи можно повторить.');return;}this.s.running=true;this.worker=setInterval(()=>{if(this.el.closest('[data-variant]').hidden){this.stopWorker();this.renderQueue();return;}const j=this.s.jobs.find(x=>['pending','rendering','scheduled'].includes(x.status));if(!j){this.stopWorker();this.renderQueue();this.tell('Демоцикл завершён. Ни один ролик не был отправлен в соцсети.');return;}if(j.status==='pending'){j.status='rendering';j.progress=35;}else if(j.status==='rendering'){j.progress+=35;if(j.progress>=100)j.status='scheduled';}else j.status='published';this.renderQueue();},450);this.renderQueue();this.tell('Демонстрация: обработка → расписание → опубликовано. Время здесь ускорено.');}
  jobDialog(id){const j=this.s.jobs.find(x=>x.id===id);if(!j)return;this.dialog('Детали демозадачи',`<p><strong style="color:var(--e-text)">${escape(j.title)}</strong><br>${escape(j.channelName)}</p><p>Баннер: ${clock(j.config.start)}, длительность ${j.config.duration} с, ширина ${j.config.width}%.</p><p>Яркость: ${j.config.brightness}; контраст: ${j.config.contrast}%.</p><label class="e-label"><span>Описание</span><textarea class="e-field" readonly>${escape(j.caption)}</textarea></label><p>Это локальная демозадача; URL публикации не создаётся.</p>`,'');}
  channels(){const pages=Math.max(1,Math.ceil(this.s.channels.length/6)),page=Math.max(0,Math.min(pages-1,this.s.channelPage||0));this.s.channelPage=page;return `<main class="e-content"><div class="e-page-head"><div><h1>Каналы и доступы</h1><p>Демонстрационные подключения, без паролей и токенов.</p></div>${button(icon('plus')+' Добавить канал','channel-add','primary')}</div><div class="e-channel-list">${this.s.channels.slice(page*6,page*6+6).map(ch=>`<article class="e-channel"><div class="e-row e-between"><div class="e-row"><span class="e-avatar">${ch.platform}</span><div><h3>${escape(ch.name)}</h3><span class="e-small e-muted">${ch.platform==='TT'?'TikTok':'YouTube Shorts'}</span></div></div><span class="e-badge ${ch.connected?'good':'bad'}">${ch.connected?'Доступ есть':'Нужен вход'}</span></div><div class="e-row">${button(ch.enabled?'В сетке ✓':'Не участвует','channel-toggle','small',`data-id="${ch.id}" aria-pressed="${ch.enabled}"`)}${button(ch.connected?'Отключить доступ':'Подключить','channel-connect','small',`data-id="${ch.id}"`)}${button('Удалить','channel-delete','small danger',`data-id="${ch.id}"`)}</div></article>`).join('')}</div>${pages>1?`<div class="e-pager">${button('←','channel-page','small',`data-delta="-1" aria-label="Предыдущие каналы" ${page===0?'disabled':''}`)}<span class="e-mono e-muted">${page+1} / ${pages} · ${this.s.channels.length} каналов</span>${button('→','channel-page','small',`data-delta="1" aria-label="Следующие каналы" ${page===pages-1?'disabled':''}`)}</div>`:''}</main>`;}
  stats(){const factor=Number(this.s.statsPeriod)/7,rows=this.s.channels.filter(ch=>this.s.statsPlatform==='all'||ch.platform===this.s.statsPlatform).map((ch,i)=>({ch,views:Math.round(([12400,8100,5600,9800,7200,4100][i%6]+this.s.refresh*132)*factor)})),total=rows.reduce((sum,x)=>sum+x.views,0),max=Math.max(...rows.map(x=>x.views),1),pages=Math.max(1,Math.ceil(rows.length/6)),page=Math.max(0,Math.min(pages-1,this.s.statsPage||0));this.s.statsPage=page;return `<main class="e-content"><div class="e-page-head"><div><h1>Статистика сетки</h1><p>Условные показатели для проверки интерфейса.</p></div>${button(icon('refresh-cw')+' Обновить демо','stats-refresh')}</div><div class="e-toolbar"><select class="e-field" data-stat="statsPlatform" aria-label="Платформа статистики">${option('all','Обе платформы',this.s.statsPlatform)}${option('TT','Только TikTok',this.s.statsPlatform)}${option('YT','Только YouTube',this.s.statsPlatform)}</select><select class="e-field" data-stat="statsPeriod" aria-label="Период статистики">${option('1','За сутки',this.s.statsPeriod)}${option('7','За 7 дней',this.s.statsPeriod)}${option('30','За 30 дней',this.s.statsPeriod)}</select></div><div class="e-summary"><div class="e-stat"><span>Просмотры · демо</span><strong>${fmt(total)}</strong></div><div class="e-stat"><span>Лайки · демо</span><strong>${fmt(Math.round(total*.038))}</strong></div><div class="e-stat"><span>Каналов в отчёте</span><strong>${rows.length}</strong></div></div><h2>Просмотры по каналам</h2><div class="e-bars" role="img" aria-label="Демонстрационное сравнение просмотров по каналам">${rows.slice(page*6,page*6+6).map(({ch,views})=>`<div><div class="e-bar-label"><span>${ch.platform} / ${escape(ch.name)}</span><strong class="e-mono">${fmt(views)}</strong></div><div class="e-bar-track"><span style="width:${views/max*100}%"></span></div></div>`).join('')}</div>${pages>1?`<div class="e-pager">${button('←','stats-page','small',`data-delta="-1" aria-label="Предыдущие показатели" ${page===0?'disabled':''}`)}<span class="e-mono e-muted">${page+1} / ${pages}</span>${button('→','stats-page','small',`data-delta="1" aria-label="Следующие показатели" ${page===pages-1?'disabled':''}`)}</div>`:''}</main>`;}
  settings(){const s=this.s.settings;return `<main class="e-content"><div class="e-page-head"><div><h1>Настройки программы</h1><p>Выборы сохраняются в состоянии прототипа.</p></div></div><div class="e-settings"><h2>Экспорт и расписание</h2><label class="e-label"><span>Кодировщик</span><select class="e-field" data-setting="encoder">${option('auto','Автоматический выбор',s.encoder)}${option('cpu','Программный H.264',s.encoder)}${option('gpu','Аппаратный — если доступен',s.encoder)}</select></label><label class="e-label"><span>Качество видео</span><select class="e-field" data-setting="quality">${option('high','Высокое',s.quality)}${option('balanced','Баланс качества и размера',s.quality)}</select></label><label class="e-label"><span>Интервал между каналами, мин</span><input class="e-field" type="number" min="5" max="180" value="${s.interval}" data-setting="interval"></label><label class="e-label"><span>Часовой пояс</span><select class="e-field" data-setting="timezone">${option('Europe/Moscow','Москва · UTC+3',s.timezone)}${option('UTC','UTC',s.timezone)}</select></label><label class="e-check"><input type="checkbox" data-setting="notifications" ${s.notifications?'checked':''}> Показывать уведомления о завершении</label><div class="e-row" style="margin-top:23px">${button('Сохранить настройки','settings-save','primary')}${button('Сбросить демо','reset-demo','danger')}</div><hr class="e-divider"><h3>Граница прототипа</h3><p class="e-small e-muted" style="margin-top:10px">Можно открыть свои видео и изображения локально, менять предпросмотр и проверять сценарии. Экспорт, FFmpeg, OAuth и реальные публикации подключаются на этапе разработки приложения.</p></div></main>`;}
  dialog(title,content,actions){const layer=this.q('[data-dialog]');this.pause();this.lastFocus=document.activeElement;this.q('.e-layout').inert=true;this.q('.e-head').inert=true;layer.hidden=false;layer.innerHTML=`<div class="e-dialog" role="dialog" aria-modal="true" aria-labelledby="${this.id}-dialog-title"><div class="e-row e-between"><h2 id="${this.id}-dialog-title">${escape(title)}</h2>${button('×','close-dialog','quiet small','aria-label="Закрыть окно"')}</div>${content}<div class="e-modal-error" data-modal-error role="alert"></div><div class="e-row">${button('Закрыть','close-dialog')}${actions}</div></div>`;layer.onkeydown=e=>{if(e.key!=='Tab')return;const items=[...layer.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}};this.icons();requestAnimationFrame(()=>layer.querySelector('input,select,textarea,button')?.focus());}
  modalError(message){this.q('[data-modal-error]').textContent=message;}
  closeDialog(){const layer=this.q('[data-dialog]');if(layer.hidden)return;layer.hidden=true;layer.innerHTML='';layer.onkeydown=null;this.q('.e-layout').inert=false;this.q('.e-head').inert=false;if(this.lastFocus?.isConnected)this.lastFocus.focus();}
 }
 instances.push(new Editor(document.getElementById('ed-classic'),'classic'));
 let iconAttempts=0;const iconTimer=setInterval(()=>{iconAttempts++;if(globalThis.lucide){instances.forEach(app=>app.icons());clearInterval(iconTimer);}else if(iconAttempts>=12)clearInterval(iconTimer);},250);
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.editors;if(!Array.isArray(saved)||ownSnapshots.has(JSON.stringify(saved)))return;instances.forEach(app=>{app.applySaved(saved.find(x=>x.id===app.id));app.renderView();});});
})();
</script>
