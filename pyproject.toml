[project]
name = "survivalflow"
version = "0.1.0"
requires-python = ">=3.12"
description = "Local video preparation, publishing queue and analytics"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

